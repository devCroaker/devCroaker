packages:
  - "apps/*"
  - "packages/*"
  - "infra"
# esbuild ships prebuilt platform binaries via a postinstall script.
# Required by drizzle-kit and vite.
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - "@aws-sdk/credential-providers@3.1110.0"
  - "@aws-sdk/rds-signer@3.1110.0"
  - "@hono/zod-openapi@1.5.3"
  - "@scalar/client-side-rendering@0.3.7"
  - "@scalar/hono-api-reference@0.11.14"
  - "@scalar/types@0.18.0"
  - hono@4.13.2
  - aws-cdk-lib@2.265.0
