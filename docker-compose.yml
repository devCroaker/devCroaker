services:
  postgres:
    image: postgres:17-alpine
    container_name: devcroaker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devcroaker
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: devcroaker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devcroaker -d devcroaker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
